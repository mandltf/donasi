steps:
  - name: 'gcr.io/cloud-builders/npm'
    args: ['ci', '--no-audit', '--fund=false']

  - name: 'gcr.io/cloud-builders/npm'
    args: ['run', 'build']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - -c
      - |
        set -euo pipefail
        gcloud app deploy app.yaml --project=${PROJECT_ID} --quiet

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
